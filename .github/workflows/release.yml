name: build-release

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ncm-patch-windows-x64.exe
            python: '3.12'
          - os: macos-latest
            artifact: ncm-patch-macos-x64
            python: '3.12'
          - os: ubuntu-latest
            artifact: ncm-patch-linux-x64
            python: 'system'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (Windows / macOS)
        if: matrix.python != 'system'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = "system" ]; then PY=python3; else PY=python; fi
          $PY -m pip install --quiet pyinstaller
          $PY -m PyInstaller NCM转换台.spec
          ls -la dist/

      - name: Stage artifact
        shell: bash
        run: |
          if [ -f "dist/NCM转换台.exe" ]; then SRC="dist/NCM转换台.exe"; else SRC="dist/NCM转换台"; fi
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$SRC" "$RUNNER_TEMP/artifacts/${{ matrix.artifact }}"
          ls -la "$RUNNER_TEMP/artifacts/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          update_release: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          body: |
            NCM 转换台 —— 网易云音乐 .ncm 批量转换工具（零第三方依赖，纯标准库解密引擎）。

            ## 各平台包
            - `ncm-patch-windows-x64.exe` — Windows 单文件，双击即用
            - `ncm-patch-macos-x64` — macOS 可执行文件（终端运行：`chmod +x` 后执行）
            - `ncm-patch-linux-x64` — Linux 可执行文件（终端运行：`chmod +x` 后执行）
            - Source code — 源码包（任意平台 `python ncm_web.py` 运行，需 Python 3.8+）

            ## 使用
            Windows 双击 exe 自动打开浏览器界面；macOS/Linux 在终端 `./ncm-patch-*` 运行后访问 `http://127.0.0.1:8765/`。
            命令行：`python ncm_flac_processor.py 源目录 -o 输出目录`（源码方式）。

            完整说明见 README。
          files: release-assets/*
